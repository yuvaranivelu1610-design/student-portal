<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Student Marks</h1>

        <p>Subject Wise Marks</p>

        <div class="student-info">

            <h2>Academic Performance</h2>

            <table class="marks-table">

                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>

                <tr>
                    <td>Digital Electronics</td>
                    <td>92</td>
                    <td>A+</td>
                </tr>

                <tr>
                    <td>Analog Electronics</td>
                    <td>88</td>
                    <td>A+</td>
                </tr>

                <tr>
                    <td>Signals and Systems</td>
                    <td>85</td>
                    <td>A</td>
                </tr>

                <tr>
                    <td>Communication Systems</td>
                    <td>82</td>
                    <td>A</td>
                </tr>

                <tr>
                    <td>VLSI Design</td>
                    <td>90</td>
                    <td>A+</td>
                </tr>

                <tr>
                    <td>Microprocessors</td>
                    <td>87</td>
                    <td>A</td>
                </tr>

            </table>

        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Marks</h3>
                <p>524</p>
            </div>

            <div class="card">
                <h3>Percentage</h3>
                <p>87.3%</p>
            </div>

        </div>

        <br>

        <button onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

</body>

</html>
